spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/qlsk_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_PASSWORD} 
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  profiles:
    active: dev  # <--- Thêm dòng này vào để mặc định luôn chạy profile dev khi khởi động

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true