server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Nén văn bản: bundle JS của dự án khá lớn (React + Recharts + html5-qrcode),
    # nén xuống còn khoảng 1/4 nên trang mở nhanh hơn rõ rệt.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Chuyển tiếp API sang container backend.
    #
    # Nhờ có block này, trình duyệt luôn gọi cùng origin với trang đang mở (ví dụ
    # http://localhost:3000/api/v1/events) rồi nginx mới gọi tiếp vào mạng nội bộ của Docker.
    # Hệ quả: KHÔNG phát sinh CORS, và không phải nhúng địa chỉ backend vào bundle —
    # cùng một image frontend chạy được ở mọi môi trường.
    #
    # `backend` là tên service trong docker-compose.yml, Docker tự phân giải thành IP nội bộ.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Xuất báo cáo CSV có thể mất vài giây khi dữ liệu nhiều — nới timeout để nginx
        # không cắt giữa lúc backend đang sinh file.
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # Swagger UI: tiện cho buổi demo, xem tài liệu API ngay trên cùng một cổng
    location ~ ^/(swagger-ui|v3/api-docs) {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # File có hash trong tên (Vite sinh ra) nên cache được vĩnh viễn — đổi nội dung là
    # đổi tên file, không bao giờ phục vụ bản cũ sai.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # BẮT BUỘC với React Router: người dùng đang ở /events/5 rồi bấm F5 thì trình duyệt
    # xin nginx đúng đường dẫn đó. Trên đĩa không có file nào tên /events/5 nên nếu thiếu
    # dòng này nginx trả 404 — lỗi kinh điển của SPA. try_files đẩy về index.html để
    # React Router tự dựng lại đúng trang.
    location / {
        try_files $uri $uri/ /index.html;

        # index.html KHÔNG được cache: nó là file trỏ tới bundle mới; cache nó thì sau khi
        # deploy bản mới người dùng vẫn nạp bundle cũ đã bị xoá -> trang trắng.
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
